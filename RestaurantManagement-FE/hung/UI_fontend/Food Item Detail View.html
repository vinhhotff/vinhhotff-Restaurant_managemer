<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Food Item Detail View</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4c325",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221e10",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-[#121212] font-display antialiased min-h-screen flex items-center justify-center p-4 lg:p-8">
<!-- Modal Overlay/Wrapper -->
<div class="relative w-full max-w-6xl mx-auto shadow-2xl rounded-xl overflow-hidden bg-background-dark flex flex-col lg:flex-row h-auto lg:min-h-[600px] animate-fade-in-up">
<!-- Close Button (Absolute positioned for easy access) -->
<button class="absolute top-4 right-4 z-20 p-2 rounded-full bg-black/20 text-white/70 hover:bg-black/40 hover:text-white transition-all backdrop-blur-sm lg:hidden">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Left Column: Image -->
<div class="w-full lg:w-7/12 relative min-h-[300px] lg:min-h-full group">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="Top down view of a rich beef pho soup bowl with fresh herbs and lime" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC48Z0GCDG37orwvbWwW3DxpyRbCqTcaifwRWHD8nqKY4gry6DQn_zArknFuri0JrUUR40n4R86tyFum_MA51hcGyAzjJlrOhZBfZTA773T4wpFeBf5vvIl_CkXbX2Xe8Y6QPpIqmv99M_3aEL6K686nAfTT1mHmzYPZ2K6O6ZgjZygPGgbd99Z4IBAsdrDa6zjVJ0XmJ43ddNsWHgiqFYM2geEdiHfen3eLAcNxGzMzt6U--VZFuaGWPspjCC3pJQLAsxj0LGivsdE");'>
</div>
<!-- Gradient Overlay for mobile text readability if needed, or just aesthetic -->
<div class="absolute inset-0 bg-gradient-to-t from-background-dark/80 via-transparent to-transparent lg:hidden"></div>
</div>
<!-- Right Column: Product Details -->
<div class="w-full lg:w-5/12 flex flex-col bg-background-dark relative">
<!-- Desktop Close Button -->
<div class="hidden lg:flex justify-end p-4 absolute top-0 right-0 z-10">
<button class="text-white/40 hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto p-6 lg:p-10 custom-scrollbar">
<!-- Header Info -->
<div class="mb-8">
<div class="flex items-start justify-between gap-4 mb-2">
<h1 class="text-3xl lg:text-4xl font-extrabold text-white leading-tight tracking-tight">Signature Phở Bò <span class="block text-xl lg:text-2xl font-medium text-white/60 mt-1">(Beef Noodle Soup)</span></h1>
</div>
<div class="flex items-center gap-3 my-4">
<span class="text-primary text-2xl font-bold">89,000 VND</span>
</div>
<p class="text-[#bab39c] text-base leading-relaxed font-normal">
                        Slow-cooked beef bone broth infused with star anise, cinnamon, and charred ginger. Served with flat rice noodles, rare beef tenderloin slices, and fresh herbs. A comforting classic reimagined.
                    </p>
</div>
<div class="w-full h-px bg-white/10 my-6"></div>
<!-- Quantity Selector -->
<div class="mb-6">
<label class="text-white text-sm font-semibold uppercase tracking-wider mb-3 block opacity-80">Quantity</label>
<div class="flex items-center gap-4 bg-[#2f2b1d]/50 w-fit p-1 pr-4 rounded-full border border-white/5">
<button class="w-10 h-10 rounded-full bg-[#393528] hover:bg-primary hover:text-background-dark text-white flex items-center justify-center transition-all cursor-pointer group">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<span class="text-xl font-bold text-white min-w-[30px] text-center">1</span>
<button class="w-10 h-10 rounded-full bg-primary text-background-dark hover:bg-white hover:text-background-dark flex items-center justify-center transition-all cursor-pointer shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
<!-- Special Instructions -->
<div class="mb-8">
<label class="flex flex-col w-full">
<span class="text-white text-sm font-semibold uppercase tracking-wider mb-3 opacity-80">Special Instructions</span>
<textarea class="form-input w-full resize-none rounded-lg text-white placeholder:text-[#bab39c]/50 bg-[#2f2b1d] border border-[#544e3b] focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none min-h-[120px] p-4 text-base transition-colors" placeholder="e.g., No spicy, extra lime, no onions..."></textarea>
</label>
</div>
</div>
<!-- Sticky/Bottom Action Bar -->
<div class="p-6 lg:p-10 border-t border-white/10 bg-background-dark z-10 mt-auto">
<button class="w-full group relative flex items-center justify-between overflow-hidden rounded-xl bg-primary px-6 py-4 transition-all hover:bg-[#ffd633] active:scale-[0.99]">
<span class="font-bold text-background-dark text-lg group-hover:translate-x-1 transition-transform">Add to Cart</span>
<span class="font-bold text-background-dark text-lg opacity-90">89,000 VND</span>
<!-- Decorative shimmer effect -->
<div class="absolute inset-0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] bg-gradient-to-r from-transparent via-white/20 to-transparent z-0"></div>
</button>
</div>
</div>
</div>
<!-- Background Decoration (Optional for mood) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-0 left-0 w-full h-full bg-[#121212]"></div>
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
</div>
</body></html>
